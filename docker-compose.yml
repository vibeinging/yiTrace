services:
  yitrace:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      YT_BIND: 0.0.0.0:7878
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
