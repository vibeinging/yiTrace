[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "yitrace-db"
version = "0.1.5"
description = "Embedded local-first TraceDB for AI agents in Python"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "yiTrace" }]
keywords = [
    "ai-agent",
    "tracedb",
    "trace-database",
    "agent-observability",
    "ai-observability",
    "llm-observability",
    "opentelemetry",
    "openinference",
    "agent-memory",
    "vector-search",
    "bm25",
    "evals",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23"]

[project.scripts]
yitrace-db = "yitrace_db.cli:main"

[project.urls]
Homepage = "https://github.com/vibeinging/yiTrace"
Repository = "https://github.com/vibeinging/yiTrace"
Issues = "https://github.com/vibeinging/yiTrace/issues"

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "yitrace_db._native"
features = ["pyo3/extension-module"]
